<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SEM-TV Atlas player</title>
<style>
  @font-face { font-family: basicFont; src: url('/legacy/PPNeueMachina-InktrapRegular.woff') format('woff'); }
  @font-face { font-family: headerFont; src: url('/legacy/BBManualMonoProOR-Medium.otf') format('opentype'); }
  :root { --bg:#501237; --accent:#ff5000; --cream:#ece8e1; --lav:#cfb6df; --peach:#fd925b; --rule:rgba(207,182,223,.26); }
  * { box-sizing: border-box; }
  html, body { touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--accent);
    font-family: basicFont, -apple-system, 'Segoe UI', Roboto, sans-serif; cursor:none; user-select:none; -webkit-user-select:none; }
  #app { display:flex; flex-direction:column; height:100vh; }
  html, body, .header, .footer { transition: background-color .6s ease, color .6s ease, border-color .6s ease; }
  .header { background:var(--hbg, var(--accent)); color:var(--htext, var(--bg)); padding:3vh 3vw; text-align:center; flex:none; }
  .header h2 { color:inherit; margin:0; font-family: headerFont, sans-serif; font-size:6vh; letter-spacing:.5vh; font-weight:700; }
  .body { flex:1; position:relative; overflow:hidden; }
  .slide { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:3vh 4vw; text-align:center; opacity:0; transition:opacity .4s ease; }
  .slide.on { opacity:1; }
  .footer { background:var(--bg); padding:2.4vh 4vw; display:flex; align-items:center; justify-content:space-between; flex:none; border-top:2px solid var(--accent); }
  .footer .msg { font-size:2.5vh; font-weight:500; text-align:left; padding-right:2vw; }
  .footer .time { font-family: headerFont, sans-serif; font-size:5vh; font-weight:600; white-space:nowrap; }
  .dot { position:fixed; right:6px; bottom:6px; width:10px; height:10px; border-radius:50%; background:#e53935; display:none; z-index:9; }
  body.offline .dot { display:block; }
  .big { font-size:clamp(2em, 8vh, 9em); font-weight:700; line-height:1.15; margin:0; }
  .mid { font-size:clamp(1em, 4vh, 5em); font-weight:700; margin:3vh 0 0; }
  .small { font-size:clamp(.8em, 2.6vh, 3em); font-weight:600; margin:2vh 0 0; opacity:.85; }
  .rows { width:92%; display:flex; flex-direction:column; gap:2.2vh; }
  .row { display:flex; align-items:center; text-align:left; border-left:3px solid var(--accent); padding:1.6vh 2.4vw; gap:3vw; }
  .row .fac { color:var(--cream); font-size:3.4vh; font-weight:700; min-width:22vw; }
  .row .val { font-size:3.6vh; font-weight:700; }
  .ov .row { padding:var(--pad) 1.6vw; gap:1.6vw; min-width:0; }
  .ov .row .fac, .ov .row .val { font-size:var(--fs); min-width:0; line-height:1.08; }
  .ov .row .fac { flex:none; white-space:nowrap; }
  .ov .row .val { flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .zone { display:inline-block; border:2px solid var(--accent); padding:.6vh 2vw; font-size:2.6vh; font-weight:700; letter-spacing:.4vh; text-transform:uppercase; margin:0 0 3vh; }
  .zlogo { max-height:14vh; max-width:40vw; margin-bottom:3vh; }
  .ztag { color:var(--lav); font-size:calc(var(--fs, 3vh) * .6); opacity:.85; white-space:nowrap; text-transform:uppercase; letter-spacing:.2vh; }

  /* ---- kleedkamer-slide: foto als achtergrond, losse badge + strak regelschema */
  #bg { position:fixed; inset:0; z-index:0; background-size:cover; background-position:center; opacity:0; transition:opacity .9s ease; }
  #bg::after { content:''; position:absolute; inset:0;
    background: linear-gradient(90deg, rgba(var(--tint,0,0,0),var(--d1,.8)) 0%, rgba(var(--tint,0,0,0),var(--d2,.6)) 100%), linear-gradient(0deg, rgba(var(--tint,0,0,0),.65) 0%, rgba(var(--tint,0,0,0),0) 38%); }
  #app { position:relative; z-index:1; }
  body.immersive .header { display:none; }
  body.immersive .footer { background:transparent; border-top:0; padding:2.4vh 6vw 3.4vh; }
  body.immersive .footer .msg { color:var(--lav); }
  .footer .time { color:var(--cream); }
  .slide.room-slide { align-items:center; justify-content:flex-start; text-align:left; padding:6vh 6vw 2vh; }
  .badge { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; width:72vw; min-width:70vw; background:var(--accent); color:var(--bg);
    border-radius:2.4vh; padding:2vh 3vw 1.8vh; box-shadow:0 1vh 4vh rgba(0,0,0,.45); line-height:1; }
  body.bs-fade .badge, body.bs-both .badge { box-shadow:none; border-radius:0;
    background:linear-gradient(90deg, rgba(0,0,0,0) 0%, var(--accent) 24%, var(--accent) 76%, rgba(0,0,0,0) 100%); }
  body.bs-3d .badge, body.bs-both .badge { transform:perspective(1300px) rotateX(16deg); transform-origin:50% 100%; }
  body.bs-3d .badge { box-shadow:0 4vh 6vh rgba(0,0,0,.55); }
  .badge .bl { font-size:2.3vh; font-weight:700; letter-spacing:.55vh; text-transform:uppercase; }
  .badge .bn { font-family:headerFont, sans-serif; font-size:15vh; font-weight:700; letter-spacing:.3vh; margin-top:.4vh; }

  /* badge-stijlen 'glass' en 'line': geen vlak oranje blok, maar een rustig gedempt paneel met fijne accentlijnen */
  body.bs-glass .badge, body.bs-line .badge { box-shadow:none; border-radius:0; color:var(--cream); padding:2.6vh 3vw 2.2vh; border-top:2px solid transparent; border-bottom:2px solid transparent;
    border-image:linear-gradient(90deg, rgba(255,255,255,0) 0%, var(--accent) 22%, var(--accent) 78%, rgba(255,255,255,0) 100%) 1; background:none; }
  body.bs-glass .badge { background:linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.5) 18%, rgba(0,0,0,.5) 82%, rgba(0,0,0,0) 100%);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  body.bs-glass .badge .bl, body.bs-line .badge .bl { color:var(--accent); font-size:2.4vh; letter-spacing:.9vh; }
  body.bs-glass .badge .bn { color:var(--cream); font-size:16vh; letter-spacing:.8vh; text-shadow:0 .6vh 2.4vh rgba(0,0,0,.5); margin-top:1vh; }
  body.bs-line .badge .bn { color:var(--accent); font-size:18vh; letter-spacing:1vh; margin-top:.6vh; text-shadow:0 .6vh 2.4vh rgba(0,0,0,.55); }

  /* ---- 'lines': twee rechte accentlijnen, boven en onder de badge */
  body.bs-lines .badge { position:relative; background:none; box-shadow:none; border-radius:0; color:var(--cream); width:72vw; min-width:70vw; padding:2.6vh 3vw 2.2vh;
    border-top:4px solid var(--accent); border-bottom:4px solid var(--accent); border-image:none; }
  body.bs-lines .rg { border-top:1px solid var(--rule); }
  body.bs-lines .badge .bl { color:var(--accent); font-size:2.4vh; letter-spacing:.9vh; }
  body.bs-lines .badge .bn { color:var(--cream); font-size:16vh; letter-spacing:.8vh; margin-top:1vh; text-shadow:0 .6vh 2.4vh rgba(0,0,0,.5); }

  /* ---- 'roof': de daklijn van het ATLAS Theater (uit de luchtfoto getraceerd) is de enige accentlijn */
  .rg { border-top:1px solid var(--rule); }
  svg.roof { display:none; }
  body.bs-glass .badge, body.bs-line .badge { border-bottom:0; }
  body.bs-roof .badge { position:relative; background:none; border:0; border-image:none; box-shadow:none; border-radius:0; color:var(--cream); width:72vw; min-width:70vw; min-height:35vh; justify-content:flex-start; padding:15vh 3vw 2vh; }
  body.bs-roof .rg { border-top:0; }
  body.bs-roof svg.roof { display:block; position:absolute; inset:0; width:100%; height:100%; z-index:0; overflow:visible;
    -webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 9%, #000 91%, transparent 100%); mask-image:linear-gradient(90deg, transparent 0%, #000 9%, #000 91%, transparent 100%); }
  body.bs-roof svg.roof .rl { stroke:var(--accent); stroke-width:5; stroke-linejoin:round; stroke-linecap:round; filter:drop-shadow(0 0 .9vh var(--accent)); }
  body.bs-roof .badge .bl, body.bs-roof .badge .bn { position:relative; z-index:1; }
  body.bs-roof .badge .bl { color:var(--accent); font-size:2.4vh; letter-spacing:.9vh; }
  body.bs-roof .badge .bn { color:var(--cream); font-size:14vh; letter-spacing:.8vh; margin-top:1vh; text-shadow:0 .6vh 2.4vh rgba(0,0,0,.5); }
  .pgbody { width:88vw; margin-top:5vh; text-align:center; color:var(--cream); }
  .pgtext { font-size:5.2vh; font-weight:600; line-height:1.3; margin:0 auto; max-width:80vw; text-shadow:0 .4vh 2vh rgba(0,0,0,.6); }
  .pgbody .clock { font-size:26vh; color:var(--cream); text-shadow:0 .6vh 3vh rgba(0,0,0,.55); }
  .pgbody .date { font-size:4.6vh; font-weight:600; }
  .pgbody .msgimg { margin-top:3vh; }
  .pgbody ul.rules { display:inline-block; text-align:left; font-size:4.2vh; color:var(--cream); }
  .pgbody .wnow { display:flex; align-items:center; justify-content:center; gap:2vw; }
  .pgbody .wnow svg { width:16vh; height:16vh; }
  .pgbody .wtp { font-size:15vh; font-weight:700; line-height:1; }
  .pgbody .wx { justify-content:center; }
  .pgbody .wx div { border:0; border-top:3px solid var(--accent); background:rgba(0,0,0,.35); }
  .pgbody .wx svg { width:7vh; height:7vh; display:block; margin:1vh auto; }
  body.bs-lines .badge.pg .bn, body.bs-glass .badge.pg .bn, body.bs-roof .badge.pg .bn { font-size:7vh; max-width:66vw; line-height:1.1; }
  .ovwrap { width:100%; max-width:88vw; height:55vh; overflow:hidden; margin-top:6vh; position:relative; }
  .ovin { display:grid; gap:0 3vw; align-content:start; will-change:transform; }
  .ovz.full { grid-column:1 / -1; margin-top:3.4vh; }
  .ovh { font-size:2.3vh; font-weight:700; letter-spacing:.5vh; text-transform:uppercase; color:var(--accent); border-bottom:0; padding-bottom:.6vh; margin-bottom:.2vh; }
  .ovr .k { white-space:normal; line-height:1.1; }
  .ovr { display:grid; grid-template-columns:minmax(0, min(calc(var(--fs) * 1.1 * var(--kc, 6)), 40%)) 1fr; align-items:baseline; gap:1.6vw; padding:var(--pad) 0; border-bottom:1px solid var(--rule); min-width:0; }
  .ovr .k { font-size:var(--fs); font-weight:700; letter-spacing:.2vh; text-transform:uppercase; color:var(--lav); white-space:normal; line-height:1.1; text-shadow:0 0 1.2vh rgba(0,0,0,.6); }
  .ovr .v { font-size:var(--fs); font-weight:700; color:var(--cream); line-height:1.1; min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .ovr .zt { display:block; font-size:calc(var(--fs) * .55); font-weight:600; opacity:.75; letter-spacing:.2vh; text-transform:uppercase; }
  body.bs-lines .badge.ovb .bn, body.bs-glass .badge.ovb .bn, body.bs-roof .badge.ovb .bn { font-size:7vh; margin-top:.6vh; }
  body.bs-lines .badge.ovb { padding:2.2vh 3vw 2vh; }
  .zlogo.corner { position:absolute; right:6vw; top:7vh; margin:0; max-height:13vh; }
  .sched { margin-top:5vh; width:100%; max-width:88vw; }
  .rg { border-top:2px solid var(--accent); margin-bottom:3.2vh; }
  .rg:last-child { margin-bottom:0; }
  .line { display:grid; grid-template-columns:22vw 1fr; align-items:baseline; gap:1vw; padding:2.1vh 0; border-bottom:1px solid var(--rule); }
  .line .k { text-shadow:0 0 1.2vh rgba(0,0,0,.6); font-size:2.3vh; font-weight:700; letter-spacing:.35vh; text-transform:uppercase; color:var(--lav); }
  .line .v { font-size:4.6vh; font-weight:700; color:var(--cream); line-height:1.15; }
  .line.main .v { font-size:7.6vh; }
  .line .v i { display:inline-block; width:1.5vh; height:1.5vh; border-radius:50%; background:var(--accent); margin-right:1.2vw; vertical-align:middle; position:relative; top:-.3vh; }
  .line.idle .v { opacity:.85; }

  /* ---- inbrandbeveiliging */
  #app { transition: transform 4s ease-in-out; will-change: transform; }
  #ss { position:fixed; inset:0; background:#000; z-index:50; display:none; overflow:hidden; }
  #ss.on { display:block; }
  .ssbox { position:absolute; left:0; top:0; display:flex; flex-direction:column; align-items:stretch; gap:1.5vh; color:var(--cream); opacity:.7; transition:transform 12s ease-in-out; will-change:transform; }
  .ssbox .ssrow { display:flex; align-items:center; gap:3vw; }
  .ssbox .wave { opacity:.7; height:8vh; }
  .ssbox svg.aclk { width:17vh; height:17vh; flex:none; }
  .ssbox .sst { font-family:headerFont, sans-serif; font-size:11vh; font-weight:700; line-height:1; letter-spacing:.3vh; }
  .ssbox .ssd { display:inline-block; background:var(--tag); color:var(--tagtext); font-size:2.2vh; font-weight:600; margin-top:1.2vh; padding:.5vh 1.2vw; border-radius:.8vh; text-transform:capitalize; white-space:nowrap; }
  .ssbox .ssdiv { width:2px; align-self:stretch; background:var(--accent, #ff5000); opacity:.8; }
  .ssbox .ssw { display:flex; align-items:center; gap:1.6vw; }
  .ssbox .ssw svg { width:11vh; height:11vh; flex:none; }
  .ssbox .ssw .tp { font-size:9vh; font-weight:700; line-height:1; }
  .ssbox .ssw .wt { color:var(--lav); font-size:2.6vh; font-weight:600; margin-top:.8vh; opacity:.8; white-space:nowrap; }
  .msgimg { max-width:70vw; max-height:42vh; margin-top:3vh; border:2px solid var(--accent); }
  .clock { font-family: headerFont, sans-serif; font-size:22vh; line-height:1; }
  .date { font-size:4vh; margin-top:2vh; text-transform:capitalize; }
  .wx { display:flex; gap:4vw; margin-top:4vh; }
  .wx div { border:2px solid var(--accent); padding:2vh 2.5vw; font-size:3vh; font-weight:700; min-width:14vw; }
  .wx b { display:block; font-size:5vh; }
  ul.rules { text-align:left; font-size:3.6vh; font-weight:600; line-height:1.5; margin:3vh 0 0; padding-left:3vw; }
  .banner { position:absolute; left:0; right:0; top:0; background:#fff; color:#b00020; font-weight:700; font-size:3vh; padding:1.2vh 2vw; z-index:5; display:none; }

  /* ---- huisstijl v4: afgeronde donkerpaarse kaders met lavendel tekst */
  :root { --cream:#cfb6df; }
  body.bs-lines .badge { background:rgba(80,18,55,.78); border:0; border-bottom:.4vh solid var(--accent); border-radius:2vh; box-shadow:0 .6vh 2.4vh rgba(0,0,0,.3); width:46vw; min-width:0; padding:1.5vh 3vw 1.3vh; }
  body.bs-lines .badge .bl { background:none; padding:0; color:var(--lav); font-size:1.9vh; letter-spacing:.7vh; }
  body.bs-lines .badge .bn { color:var(--lav); text-shadow:none; font-size:9vh; margin-top:.4vh; }
  body.bs-lines .badge.ovb { width:56vw; padding:1.3vh 3vw 1.2vh; } body.bs-lines .badge.pg { width:72vw; }
  body.bs-lines .badge.ovb .bn, body.bs-lines .badge.pg .bn { font-size:5.2vh; margin-top:.3vh; }
  .line .k, .ovh { background:var(--bg); color:var(--lav); text-shadow:none; border:.25vh solid rgba(207,182,223,.35); padding:.6vh 1.2vw .6vh calc(1.2vw + .35vh); border-radius:2vh; align-self:center; justify-self:start; white-space:nowrap; }
  .ovh { display:inline-block; margin-bottom:.8vh; }
  .ovz { display:flex; flex-direction:column; align-items:stretch; } .ovz .ovh { align-self:flex-start; }
  /* kleedkamerscherm: kop bovenaan, regels gecentreerd in de ruimte eronder */
  .slide.rm { justify-content:flex-start; padding-top:6vh; padding-bottom:6vh; }
  .slide.rm .sched { margin:auto 0; }
  .slide.rm .line { text-align:left; }
  /* ---- huisstijl v5: labels zoals de site-tags (oranje met donkere tekst, mid-purper met lichte tekst) */
  :root { --tag:#985cb4; --tagtext:#f6f0ea; --ink:#1a1a1a; }
  body.bs-lines .badge { border-bottom:0; }
  body.bs-lines .badge .bl { background:none; color:var(--accent); border:.25vh solid rgba(255,80,0,.75); padding:.5vh 1.2vw .5vh calc(1.2vw + .7vh); border-radius:.8vh; font-size:1.7vh; letter-spacing:.7vh; display:inline-block; align-self:center; }
  .line .k, .ovh { background:var(--tag); color:var(--tagtext); border:0; border-radius:.8vh; }
  /* welkom-slinger: zachte golvende tekstband boven de voetnoot, schuift rustig mee */
  .wave { flex:none; height:9.4vh; overflow:hidden; position:relative; pointer-events:none; }
  .wave svg { position:absolute; left:0; top:0; width:160vw; height:100%; }
  .wave text { font-family:basicFont, sans-serif; font-size:58px; fill:var(--lav); opacity:.45; letter-spacing:0; }
  /* ---- huisstijl v6: kop = alleen tekst, slinger eronder, strakke tags, meer ruimte */
  body.bs-lines .badge, body.bs-lines .badge.ovb, body.bs-lines .badge.pg { background:none; border:0; border-radius:0; box-shadow:none; width:auto; min-width:0; padding:0; }
  body.bs-lines .badge .bl { background:none; border:0; padding:0; color:var(--accent); font-size:2.2vh; letter-spacing:.9vh; text-shadow:0 0 1.2vh rgba(0,0,0,.6); }
  body.bs-lines .badge .bn { color:var(--lav); font-size:10vh; margin-top:.4vh; text-shadow:0 .5vh 2vh rgba(0,0,0,.6); }
  body.bs-lines .badge.ovb .bn, body.bs-lines .badge.pg .bn { font-size:6vh; }
  body.bs-lines .badge.pg { width:72vw; }
  .slide .wave { width:100vw; flex:none; height:9.4vh; margin-top:1.4vh; }
  .line .k, .ovh { border-radius:0; }
  .ssbox .ssd { border-radius:0; }
  .slide.rm .sched { padding-top:3vh; }
  .ovwrap { margin-top:3vh; height:50vh; }
  /* ---- v7: gelijke afstanden kop-slinger-regels, groter nummer, oranje tags */
  body.bs-lines .badge .bn { font-size:13vh; margin-top:.2vh; }
  body.bs-lines .badge.ovb .bn, body.bs-lines .badge.pg .bn { font-size:6vh; }
  .slide .wave { margin-top:3vh; margin-bottom:0; }
  .slide.rm .wave { margin:auto 0; }
  .slide.rm .sched { margin:auto 0; padding-top:0; }
  .ovwrap { margin-top:3vh; }
  .pgbody { margin-top:3vh; }
  .line .k, .ovh { background:var(--accent); color:var(--bg); }
  /* ---- v8: gelijke tussenruimtes */
  .slide .wave { height:7.9vh; }
  .slide .wave svg { height:9.4vh; }
  .slide.rm .wave { margin:auto 0; }
  .slide.rm .sched { margin:0 0 auto 0; }
  /* ---- v9: optisch centreren (letterspatiëring staat rechts van de laatste letter) */
  body.bs-lines .badge .bl { padding-left:.9vh; }
  body.bs-lines .badge .bn { padding-left:.9vh; }
  .line .k, .ovh { padding-top:.95vh; padding-bottom:.25vh; padding-left:calc(1.2vw + .45vh); }
  .ssbox .ssd { padding-top:.75vh; padding-bottom:.25vh; }
  /* ---- v10: witte tekstkleur voor inhoud, Overzicht in dezelfde letter, ruimere regels */
  :root { --txt:#ece8e1; }
  .line .v, .ovr .v, .pgbody, .pgtext, .pgbody ul.rules { color:var(--txt); }
  body.bs-lines .badge.ovb .bn { font-family:basicFont, -apple-system, 'Segoe UI', Roboto, sans-serif; color:var(--txt); letter-spacing:.3vh; padding-left:.3vh; font-weight:700; margin-top:.9vh; }
  .slide.rm .line { padding-top:2.9vh; padding-bottom:2.9vh; }
  /* ---- v11: ruimere tags, optische centrering behouden (+.7vh naar beneden) */
  .line .k, .ovh { padding-top:1.5vh; padding-bottom:.8vh; padding-left:calc(1.8vw + .45vh); padding-right:1.8vw; }
  /* ---- v12: statische slinger, datumtag screensaver in tagkleur */
  .ssbox .ssd { background:var(--accent); color:var(--bg); padding:1.2vh 1.4vw .7vh calc(1.4vw + .3vh); }
  .ssbox .wave { -webkit-mask-image:linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-image:linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <div class="header"><h2 id="title">&nbsp;</h2></div>
  <div class="body" id="body"></div>

  <div class="footer"><div class="msg" id="footer"></div><div class="time" id="time">--:--</div></div>
</div>
<div class="dot" id="dot"></div>
<div class="banner" id="banner"></div>
<div id="ss"><div class="ssbox" id="ssbox"></div></div>
<script>
(function () {
  'use strict';
  var qs = new URLSearchParams(location.search);
  var SCREEN = qs.get('screen') || localStorage.getItem('semtv.screen') || '';
  var IN_APP = qs.get('app') === '1';
  if (qs.get('screen')) { try { localStorage.setItem('semtv.screen', SCREEN); } catch (e) {} }

    list.sort(function (x, y) { return cmp(x.rooms[0], y.rooms[0]); });
    // blokken: per zaal (in de volgorde van de zalen), kleedkamers zonder zaal apart
    var blocks = [];
    Object.keys(STATE.zones || {}).forEach(function (zk) {
      var rows = list.filter(function (g) { return g.zone === zk; });
      if (rows.length) blocks.push({ title: STATE.zones[zk].label || zk, rows: rows });
    });
    var multi = list.filter(function (g) { return g.zone === 'multi'; });
    if (multi.length) blocks.push({ title: 'Beide zalen', rows: multi });
    var rest = list.filter(function (g) { return g.zone !== 'multi' && (!g.zone || !(STATE.zones && STATE.zones[g.zone])); });
    var head = '<div class="badge ovb"><span class="bl">Kleedkamers</span><span class="bn">' + esc(sl.badge || 'Overzicht') + '</span></div>' + waveHtml();
    if (!list.length) return head + '<div class="sched"><div class="line main idle"><span class="k">Status</span><span class="v">' + esc(STATE.texts.overviewFallback) + '</span></div></div>';
    // lettergrootte op basis van het aantal rijen in het langste blok; past het niet, dan scrolt de lijst
    var maxRows = Math.max.apply(null, blocks.map(function (b) { return b.rows.length; }).concat([rest.length ? Math.ceil(rest.length / Math.max(1, blocks.length || 1)) : 1]));
    var avail = 50 - (rest.length ? 8 : 0), rowH = Math.max(6.4, Math.min(10, avail / maxRows));
    var fs = Math.min(4.2, rowH * 0.44);
    var rowHtml = function (g) { return '<div class="ovr"><span class="k">' + g.rooms.map(esc).join(', ') + '</span><span class="v">' + esc(g.text) + '</span></div>'; };
    var blk = function (title, rows, cls) { var kc = Math.max.apply(null, rows.map(function (g) { return g.rooms.join(', ').length; })); return '<div class="ovz' + (cls || '') + '" style="--kc:' + (kc * 0.55 + .5).toFixed(1) + '"><div class="ovh">' + esc(title) + '</div>' + rows.map(rowHtml).join('') + '</div>'; };
    var inner = blocks.map(function (b) { return blk(b.title, b.rows); }).join('') + (rest.length ? blk(blocks.length ? 'Zonder zaal' : 'Kleedkamers', rest, blocks.length ? ' full' : '') : '');
    return head + '<div class="ovwrap"><div class="ovin" style="grid-template-columns:repeat(' + Math.max(1, blocks.length) + ',1fr);--fs:' + fs + 'vh;--pad:' + (rowH * 0.14) + 'vh">' + inner + '</div></div>';
  }
  // scrollt langzaam omlaag, pauzeert, gaat sneller terug (zoals het originele SEM TV-script) als de lijst niet past
  function ovStart(el) {
    var wrap = el && el.querySelector('.ovwrap'), inn = wrap && wrap.querySelector('.ovin'); if (!inn) return;
    var over = inn.scrollHeight - wrap.clientHeight; inn.style.transform = '';
    if (over < 4) return;
    var y = 0, dir = 0, until = performance.now() + 5000, last = performance.now(), down = innerHeight * 0.035, up = innerHeight * 0.2;
    (function step(t) {
      if (!document.body.contains(wrap)) return;
      var dt = Math.min(100, t - last) / 1000; last = t;
      if (t >= until) {
        if (dir === 0) { y += down * dt; if (y >= over) { y = over; dir = 1; until = t + 5000; } }
        else { y -= up * dt; if (y <= 0) { y = 0; dir = 0; until = t + 5000; } }
        inn.style.transform = 'translateY(' + (-y).toFixed(1) + 'px)';
      }
      requestAnimationFrame(step);
    })(performance.now());
  }
  // gedeelde opbouw voor mededelingen, tekst, klok en weer: badge met twee lijnen + inhoud; achtergrond/voetnoot/tijd blijven
  function pageHtml(label, title, body) {
    return '<div class="badge ovb pg"><span class="bl">' + esc(label || '') + '</span><span class="bn">' + esc(title || '') + '</span></div>' + waveHtml() + '<div class="pgbody">' + body + '</div>';
  }
  function messageHtml(sl) {
    var m = sl.msg;
    return pageHtml('Mededeling', m.title || sl.title || '', (m.text ? '<p class="pgtext" style="white-space:pre-line">' + esc(m.text) + '</p>' : '') +
      (m.image ? '<img class="msgimg" src="' + esc(m.image) + '" alt="">' : ''));
  }
  function clockHtml(sl) {
    var d = new Date();
    return pageHtml('ATLAS Theater', sl && sl.title || 'Welkom', '<div class="clock" id="bigclock">' + hhmm(d) + '</div><div class="date">' + d.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' }) + '</div>');
  }
  var WX = { 0:'Zonnig',1:'Overwegend zonnig',2:'Half bewolkt',3:'Bewolkt',45:'Mist',48:'Mist',51:'Motregen',53:'Motregen',55:'Motregen',61:'Regen',63:'Regen',65:'Zware regen',71:'Sneeuw',73:'Sneeuw',75:'Zware sneeuw',80:'Buien',81:'Buien',82:'Zware buien',95:'Onweer',96:'Onweer',99:'Onweer' };
  var weather = null;
  function weatherHtml(sl) {
    if (!weather || !weather.current) return pageHtml('Weer', sl.title || '', '<p class="pgtext">Weer niet beschikbaar</p>');
    var c = weather.current, dly = weather.daily, days = ['Vandaag', 'Morgen', 'Overmorgen'];
    return pageHtml(weather.place || 'Weer', sl.title || 'Het weer',
      '<div class="wnow">' + wxIcon(c.weather_code) + '<span class="wtp">' + Math.round(c.temperature_2m) + '°C</span></div><p class="pgtext">' + esc(WX[c.weather_code] || '') + '</p>' +
      '<div class="wx">' + (dly ? dly.time.map(function (t, i) { return '<div>' + days[i] + wxIcon(dly.weather_code[i]) + '<b>' + Math.round(dly.temperature_2m_min[i]) + '° / ' + Math.round(dly.temperature_2m_max[i]) + '°</b>' + esc(WX[dly.weather_code[i]] || '') + '</div>'; }).join('') : '') + '</div>');
  }
  function textHtml(sl) {
    var lines = String(sl.text || '').split('\n').filter(Boolean);
    var list = sl.asList ? '<ul class="rules">' + lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' : '<p class="pgtext" style="white-space:pre-line">' + esc(sl.text || '') + '</p>';
    return pageHtml(sl.title || 'Informatie', sl.heading || '', list + (sl.image ? '<img class="msgimg" src="' + esc(sl.image) + '" alt="">' : ''));
  }
  function renderHtml(sl) {
    switch (sl.kind) {
      case 'room': return roomHtml(sl);
      case 'overview': return overviewHtml(sl);
      case 'message': return messageHtml(sl);
      case 'clock': return clockHtml(sl);
      case 'weather': return weatherHtml(sl);
      case 'text': return textHtml(sl);
      default: return '';
    }
  }

  function headerFor(sl) {
    if (sl.kind === 'clock' || sl.kind === 'weather') return STATE.texts.title || '';
    return sl.title || STATE.texts.title || '';
  }

  /** Thema van de zaal waar de reservering op deze slide bij hoort; anders de standaardkleuren. */
  function applyTheme(sl) {
    var z = null;
    if (sl.kind === 'room') {
      var f = STATE.facilities[(sl.facilityIds || [])[0]], it = f && f.items[0];
      z = it && it.zone && STATE.zones ? STATE.zones[it.zone] : null;
    }
    var st = document.documentElement.style;
    [['--bg', z && z.bg], ['--accent', z && z.accent], ['--hbg', z && z.headerBg], ['--htext', z && z.headerText]].forEach(function (p) {
      if (p[1]) st.setProperty(p[0], p[1]); else st.removeProperty(p[0]);
    });
    document.body.classList.toggle('immersive', true);
    var bg = $('bg'), img = '', dm = 65;
    {
      if (z && z.bgImage) { img = z.bgImage; dm = z.bgDim == null ? 55 : z.bgDim; }
      else if (STATE.defaults && STATE.defaults.bgImage) { img = STATE.defaults.bgImage; dm = STATE.defaults.bgDim; }
    }
    if (img) {
      var dim = Math.max(0, Math.min(90, dm)) / 100;
      bg.style.setProperty('--d1', Math.min(.95, dim + .2).toFixed(2));
      bg.style.setProperty('--d2', dim.toFixed(2));
      if (bg.dataset.src !== img) { bg.dataset.src = img; bg.style.backgroundImage = 'url("' + img + '")'; }
      bg.style.opacity = 1;
    } else { bg.style.opacity = 0; }
  }
  var cur = null;
  function renderCurrent(soft) {
    var sl = queue[curIdx]; if (!sl) return;
    applyTheme(sl);
    var el = $('body').querySelector('.slide.on');
    var html = renderHtml(sl);
    if (soft && el) { if (el._h !== html) { el._h = html; el.innerHTML = html; if (sl.kind === 'overview') ovStart(el); } return; }
    var n = document.createElement('div'); n.className = 'slide room-slide' + (sl.kind === 'room' ? ' rm' : ''); n.innerHTML = html; n._h = html;
    // eerst de oude slide(s) volledig laten wegfaden, dan pas de nieuwe tonen: nooit twee slides tegelijk zichtbaar
    var olds = $('body').querySelectorAll('.slide');
    for (var i = 0; i < olds.length; i++) (function (o) { o.classList.remove('on'); setTimeout(function () { if (o.parentNode) o.parentNode.removeChild(o); }, 450); })(olds[i]);
    $('body').appendChild(n);
    $('title').textContent = headerFor(sl) || ' ';
    setTimeout(function () {
      if (!n.parentNode) return;
      n.classList.add('on'); if (sl.kind === 'overview') setTimeout(function () { ovStart(n); }, 900);
    }, olds.length ? 480 : 40);
  }
  function next() {
    clearTimeout(timer);
    if (!queue.length) { timer = setTimeout(next, 5000); $('body').innerHTML = ''; return; }
    curIdx = (curIdx + 1) % queue.length;
    renderCurrent(false);
    // één slide: niet roteren, alleen verversen
    timer = setTimeout(next, queue.length === 1 ? 600000 : queue[curIdx].d);
  }

  /* ---------- klok, weer, polling */
  function hhmm(d) { return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function tick() { var d = new Date(); $('time').textContent = hhmm(d); var bc = $('bigclock'); if (bc) bc.textContent = hhmm(d); }
  function loadWeather() { fetch('/api/player/weather').then(function (r) { return r.json(); }).then(function (w) { weather = w; }).catch(function () {}); }

  /* ---------- browser-players (Android TV): heartbeat zodat 'herladen' op afstand werkt */
  function heartbeat() {
    if (IN_APP || !SCREEN) return;
    fetch('/api/device/' + encodeURIComponent(SCREEN) + '/heartbeat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: 'browser', ua: navigator.userAgent.slice(0, 120), width: innerWidth, height: innerHeight, ackIds: window.__ack || [] }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        window.__ack = (r.commands || []).map(function (c) { return c.id; });
        if ((r.commands || []).some(function (c) { return c.type === 'reload' || c.type === 'restart_app' || c.type === 'reboot' || c.type === 'clear_cache'; })) {
          // bevestig eerst, dan herladen
          fetch('/api/device/' + encodeURIComponent(SCREEN) + '/heartbeat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'browser', ackIds: window.__ack }) })
            .then(function () { location.reload(); });
        }
      }).catch(function () {});
  }

  /* ---------- screensaver (zwart, bewegend) en pixel-shift */
  function wxIcon(c) {
    var A = 'var(--accent,#ff5000)', cl = '<path d="M20 44h26a9 9 0 0 0 1-17.9A13 13 0 0 0 22 29a8 8 0 0 0-2 15z" fill="none" stroke="var(--cream)" stroke-width="3" stroke-linejoin="round"/>';
    var sun = function (x, y, r) { var o = '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="none" stroke="' + A + '" stroke-width="3"/>';
      for (var i = 0; i < 8; i++) { var an = i * Math.PI / 4, c1 = Math.cos(an), s1 = Math.sin(an);
        o += '<line x1="' + (x + c1 * (r + 4)).toFixed(1) + '" y1="' + (y + s1 * (r + 4)).toFixed(1) + '" x2="' + (x + c1 * (r + 9)).toFixed(1) + '" y2="' + (y + s1 * (r + 9)).toFixed(1) + '" stroke="' + A + '" stroke-width="3" stroke-linecap="round"/>'; } return o; };
    var body;
    if (c === 0) body = sun(32, 32, 10);
    else if (c <= 2) body = sun(24, 24, 7) + '<g transform="translate(6 8) scale(.85)">' + cl + '</g>';
    else if (c === 3) body = cl;
    else if (c === 45 || c === 48) body = '<g stroke="var(--cream)" stroke-width="3" stroke-linecap="round"><line x1="12" y1="24" x2="52" y2="24"/><line x1="8" y1="34" x2="48" y2="34"/><line x1="14" y1="44" x2="54" y2="44"/></g>';
    else if (c >= 71 && c <= 77) body = cl + '<g fill="' + A + '"><circle cx="24" cy="52" r="2.6"/><circle cx="34" cy="56" r="2.6"/><circle cx="44" cy="52" r="2.6"/></g>';
    else if (c >= 95) body = cl + '<path d="M35 44l-7 10h7l-4 8 11-13h-7l4-5z" fill="' + A + '"/>';
    else body = cl + '<g stroke="' + A + '" stroke-width="3" stroke-linecap="round"><line x1="24" y1="50" x2="21" y2="58"/><line x1="34" y1="50" x2="31" y2="58"/><line x1="44" y1="50" x2="41" y2="58"/></g>';
    return '<svg viewBox="0 0 64 64" aria-hidden="true">' + body + '</svg>';
  }
  function analogSvg() {
    var t = '';
    for (var i = 0; i < 12; i++) t += '<line x1="50" y1="' + (i % 3 ? 8 : 5) + '" x2="50" y2="' + (i % 3 ? 12 : 14) + '" stroke="rgba(236,232,225,.75)" stroke-width="' + (i % 3 ? 1.6 : 2.8) + '" stroke-linecap="round" transform="rotate(' + (i * 30) + ' 50 50)"/>';
    return '<svg class="aclk" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(207,182,223,.45)" stroke-width="1.6"/>' + t +
      '<line id="ssh" x1="50" y1="50" x2="50" y2="26" stroke="var(--cream)" stroke-width="4" stroke-linecap="round"/>' +
      '<line id="ssm" x1="50" y1="50" x2="50" y2="14" stroke="var(--cream)" stroke-width="2.8" stroke-linecap="round"/>' +
      '<line id="sss" x1="50" y1="56" x2="50" y2="12" stroke="var(--accent,#ff5000)" stroke-width="1.4" stroke-linecap="round"/>' +
      '<circle cx="50" cy="50" r="3" fill="var(--accent,#ff5000)"/></svg>';
  }
  function ssBuild() {
    var path = 'M0 70 q125 -56 250 0'; for (var q = 0; q < 15; q++) path += ' t250 0';
    var txt = ''; for (var r = 0; r < 16; r++) txt += 'welkom · ';
    $('ssbox').innerHTML = '<div class="ssrow">' + analogSvg() + '<div><div class="sst" id="sst"></div><div class="ssd" id="ssd"></div></div><div class="ssdiv"></div><div class="ssw" id="ssw"></div></div>' +
      '<div class="wave" aria-hidden="true"><svg viewBox="0 0 4000 140" preserveAspectRatio="none"><defs><path id="wv2" d="' + path + '"/></defs><text><textPath href="#wv2" textLength="4000" lengthAdjust="spacing">' + txt.trim() + '</textPath></text></svg></div>';
  }
  function ssTick() {
    var d = new Date(), h = d.getHours() % 12, m = d.getMinutes(), sc = d.getSeconds();
    if (!$('sst')) return;
    $('sst').textContent = hhmm(d);
    $('ssd').textContent = d.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
    $('ssh').setAttribute('transform', 'rotate(' + ((h + m / 60) * 30) + ' 50 50)');
    $('ssm').setAttribute('transform', 'rotate(' + ((m + sc / 60) * 6) + ' 50 50)');
    $('sss').setAttribute('transform', 'rotate(' + (sc * 6) + ' 50 50)');
    var w = $('ssw');
    if (weather && weather.current) {
      var dl = weather.daily, rng = dl ? ' · ' + Math.round(dl.temperature_2m_min[0]) + '° / ' + Math.round(dl.temperature_2m_max[0]) + '°' : '';
      w.innerHTML = wxIcon(weather.current.weather_code) + '<div><div class="tp">' + Math.round(weather.current.temperature_2m) + '°</div><div class="wt">' + esc(WX[weather.current.weather_code] || '') + esc(rng) + '</div></div>';
    } else w.innerHTML = '';
  }
  // blijft 1 minuut stil staan en schuift dan langzaam naar een nieuwe plek
  function ssMove(instant) {
    var box = $('ssbox'); if (!box) return;
    var x = Math.random() * Math.max(0, innerWidth - box.offsetWidth), y = Math.random() * Math.max(0, innerHeight - box.offsetHeight);
    if (instant) box.style.transition = 'none';
    box.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
    if (instant) { void box.offsetWidth; box.style.transition = ''; }
  }
  var ssOn = false, ssMoveTimer = null, ssTickTimer = null;
  function ssCheck() {
    if (!STATE) return;
    var mins = (STATE.screensaver && STATE.screensaver.idleMinutes) || 0;
    var want = mins > 0 && idleSince && Date.now() - idleSince >= mins * 60000 && Date.now() > wakeUntil;
    if (want && !ssOn) {
      ssOn = true; ssBuild(); $('ss').classList.add('on'); ssTick(); ssMove(true);
      ssMoveTimer = setInterval(ssMove, 60000); ssTickTimer = setInterval(ssTick, 1000);
    } else if (!want && ssOn) { ssOn = false; $('ss').classList.remove('on'); clearInterval(ssMoveTimer); clearInterval(ssTickTimer); }
  }
  setInterval(ssCheck, 5000);
  // aanraking wekt het scherm 60 s (idle-teller loopt daarna weer door)
  ['touchstart', 'mousedown'].forEach(function (ev) { document.addEventListener(ev, function () { wakeUntil = Date.now() + 60000; ssCheck(); }, true); });

  var SHIFTS = [[0, 0], [10, 6], [-8, 10], [6, -10], [-12, -4], [12, -6], [-6, 8], [8, 12], [-10, -10]], shiftI = 0;
  function pixelShift() {
    if (!STATE || !(STATE.screensaver && STATE.screensaver.pixelShift)) { $('app').style.transform = ''; return; }
    shiftI = (shiftI + 1) % SHIFTS.length;
    $('app').style.transform = 'translate(' + SHIFTS[shiftI][0] + 'px,' + SHIFTS[shiftI][1] + 'px)';
  }
  setInterval(pixelShift, 60000);

  // zoomen blokkeren (pinch, dubbeltik, Ctrl+scroll, Ctrl +/-) voor browsers die de viewport-meta negeren
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }); });
  document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].indexOf(e.key) >= 0) e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  tick(); setInterval(tick, 1000);
  load(); setInterval(load, 20000);
  loadWeather(); setInterval(loadWeather, 600000);
  heartbeat(); setInterval(heartbeat, 20000);

  /* ---------- Ubuntu-agent (kiosk-browser met &agent=1): zwart scherm en herladen op afstand via 127.0.0.1:8765 */
  if (qs.get('agent') === '1') {
    var agOff = document.createElement('div');
    agOff.style.cssText = 'position:fixed;inset:0;background:#000;z-index:2147483647;display:none;cursor:none';
    document.body.appendChild(agOff);
    var agReload = null;
    setInterval(function () {
      fetch('http://127.0.0.1:8765/state', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (a) {
        agOff.style.display = a.off ? 'block' : 'none';
        if (agReload === null) agReload = a.reload; else if (a.reload !== agReload) location.reload();
      }).catch(function () {});
    }, 2000);
  }

  // dagelijkse volledige herlaad tegen geheugenlekken (alleen buiten de app)
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
})();
</script>
