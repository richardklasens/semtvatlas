services:
  semtvatlas:
    build: .
    container_name: semtvatlas
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"   # poort op de server; pas aan met de variabele PORT als 8080 bezet is
    environment:
      # Verander deze waarden vóór de eerste start!
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-verander-mij}"
      DEVICE_KEY: "${DEVICE_KEY:-}"          # optioneel: gedeelde sleutel die de Android-apps meesturen
      SEM_URL: "${SEM_URL:-}"                # adres van de SEM-API, bijv. https://<jouw-omgeving>.smarteventmanager.nl/api/pages
      SEM_MOCK: "${SEM_MOCK:-0}"             # 1 = testdata zonder SEM-verbinding
      TZ: Europe/Amsterdam
    volumes:
      - semtv-data:/data

volumes:
  semtv-data:
